<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비올라 추천곡 - 마음에 드는 곡을 골라보세요</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#f5f0e6;--card:#fff;--text:#2c2416;--text2:#5a4d3e;--text3:#8a7d6e;
  --green:#4a7a56;--green-dim:#3a6646;--green-light:#e8f0ea;
  --warm:#c08040;--pink:#b85060;--blue:#3a7aaa;--purple:#7a5a90;
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);line-height:1.8;min-height:100vh;}
.container{max-width:900px;margin:0 auto;padding:0 20px;}

.top-bar{
  position:sticky;top:0;z-index:100;
  background:rgba(245,240,230,0.95);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(74,122,86,0.15);padding:12px 0;
  display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap;
}
.top-bar a,.top-bar .wishcount{
  color:var(--green);text-decoration:none;font-size:0.85rem;font-weight:500;
  padding:6px 16px;border-radius:20px;border:1px solid var(--green);transition:all 0.2s;
}
.top-bar a:hover{background:var(--green);color:#fff;}
.top-bar .wishcount{background:var(--green);color:#fff;cursor:pointer;}

.hero{text-align:center;padding:70px 20px 40px;}
.hero h1{font-size:2rem;font-weight:700;color:var(--green);margin-bottom:10px;}
.hero p{color:var(--text2);font-size:0.95rem;max-width:550px;margin:0 auto;}

/* WISHLIST */
.wishlist-panel{
  background:var(--card);border-radius:14px;padding:20px 24px;margin-bottom:30px;
  border:2px solid var(--green);display:none;
}
.wishlist-panel.show{display:block;}
.wishlist-panel h3{color:var(--green);font-size:1rem;margin-bottom:12px;}
.wish-item{
  display:flex;align-items:center;gap:10px;padding:8px 0;
  border-bottom:1px solid rgba(0,0,0,0.05);font-size:0.9rem;
}
.wish-item:last-child{border-bottom:none;}
.wish-remove{
  background:none;border:none;color:var(--pink);cursor:pointer;font-size:0.8rem;
  font-family:inherit;padding:2px 8px;border-radius:10px;
}
.wish-remove:hover{background:rgba(184,80,96,0.1);}
.wish-empty{color:var(--text3);font-size:0.88rem;}

/* CATEGORY */
.cat-section{margin-bottom:50px;}
.cat-title{
  font-size:1.15rem;font-weight:700;color:var(--text);
  margin-bottom:20px;padding-bottom:10px;
  border-bottom:2px solid var(--green);
  display:flex;align-items:center;gap:10px;
}
.cat-title .emoji{font-size:1.3rem;}
.cat-desc{font-size:0.85rem;color:var(--text2);margin:-12px 0 20px;padding-left:2px;}

/* CARD */
.pick-card{
  background:var(--card);border-radius:14px;padding:20px;margin-bottom:12px;
  border:1px solid rgba(0,0,0,0.06);transition:all 0.2s;
}
.pick-card:hover{border-color:rgba(74,122,86,0.3);box-shadow:0 3px 12px rgba(0,0,0,0.05);}
.pick-card.checked{border-color:var(--green);background:#f8fbf8;}
.pick-header{display:flex;align-items:flex-start;gap:12px;}
.pick-check{
  width:22px;height:22px;border-radius:6px;border:2px solid #ccc;
  flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;margin-top:2px;background:#fff;font-size:0.75rem;color:#fff;
}
.pick-check.on{background:var(--green);border-color:var(--green);}
.pick-info{flex:1;cursor:pointer;}
.pick-title{font-size:0.95rem;font-weight:600;color:var(--text);}
.pick-composer{font-size:0.82rem;color:var(--green);margin-top:1px;}
.pick-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;}
.tag{font-size:0.7rem;padding:2px 9px;border-radius:10px;font-weight:500;}
.tag-diff{background:#e8f0ea;color:var(--green);}
.tag-mood{background:#fdf0e0;color:var(--warm);}
.tag-type{background:#e8f0f8;color:var(--blue);}
.pick-body{display:none;margin-top:14px;padding-top:12px;border-top:1px solid rgba(0,0,0,0.06);}
.pick-body.open{display:block;}
.pick-desc{font-size:0.85rem;color:var(--text2);margin-bottom:10px;}
.pick-why{
  font-size:0.85rem;color:var(--text2);padding:10px 14px;
  background:var(--green-light);border-left:3px solid var(--green);
  border-radius:0 10px 10px 0;margin-bottom:10px;
}
.pick-why strong{color:var(--green);}
.play-btn-sm{
  display:inline-flex;align-items:center;gap:6px;padding:6px 14px;
  background:var(--green);color:#fff;border-radius:16px;font-size:0.8rem;
  text-decoration:none;transition:all 0.2s;border:none;cursor:pointer;font-family:inherit;
}
.play-btn-sm:hover{background:var(--green-dim);}

footer{text-align:center;padding:40px 20px;color:var(--text3);font-size:0.8rem;border-top:1px solid rgba(0,0,0,0.06);}
footer a{color:var(--green);text-decoration:none;}
</style>
</head>
<body>

<div class="top-bar">
  <a href="index.html">← 가이드로 돌아가기</a>
  <div class="wishcount" onclick="toggleWishlist()">하고 싶은 곡 <span id="wishNum">0</span>곡</div>
</div>

<div class="hero">
  <h1>비올라 추천곡</h1>
  <p>마음에 드는 곡은 체크해두세요! 비올라의 따뜻한 음색이 빛나는 곡들을 모았어요.</p>
</div>

<div class="container">
  <div class="wishlist-panel" id="wishPanel">
    <h3>내가 하고 싶은 곡</h3>
    <div id="wishList"></div>
  </div>
  <div id="app"></div>
</div>

<footer>
  <p>비올라 추천곡 가이드 &mdash; <a href="index.html">클래식 음악 가이드</a></p>
</footer>

<script>

  {

    items: [
      {
        id:"thais", title: "마스네 — 타이스의 명상곡",
        composer: "쥘 마스네", tags: [{t:"초급~중급",c:"diff"},{t:"몽환적",c:"mood"},{t:"비올라+피아노",c:"type"}],
        desc: "오페라 '타이스'의 간주곡. 바이올린이 유명하지만, 비올라로 연주하면 더 깊고 몽환적. 비올라 음색의 진가를 보여주는 곡.",
        why: "비올라가 바이올린보다 더 예쁘게 들리는 드문 곡 중 하나! 관객이 눈 감고 빠져드는 순간이 옴.",
        yt: "Massenet Meditation Thais viola"

        desc: "'동물의 사육제' 중 가장 유명한 곡. 원래 첼로곡인데 비올라 편곡이 아름다움. 호수 위를 미끄러지듯 헤엄치는 백조.",

        why: "천국이 있다면 이런 음악이 흐를 것 같은 곡. 비올라의 중저음이 신비로운 공간감을 만듦.",

// === WISHLIST (localStorage) ===
function getWish() {
  try { return JSON.parse(localStorage.getItem('viola-wish') || '[]'); } catch { return []; }
}
function saveWish(list) {
  localStorage.setItem('viola-wish', JSON.stringify(list));
  updateWishUI();
}
function toggleWish(id, title) {
  let w = getWish();
  const idx = w.findIndex(x => x.id === id);
  if (idx >= 0) w.splice(idx, 1);
  else w.push({id, title});
  saveWish(w);
}
function updateWishUI() {
  const w = getWish();
  document.getElementById('wishNum').textContent = w.length;
  // update checkboxes
  document.querySelectorAll('.pick-check').forEach(el => {
    const on = w.some(x => x.id === el.dataset.id);
    el.classList.toggle('on', on);
    el.textContent = on ? '✓' : '';
    el.closest('.pick-card').classList.toggle('checked', on);
  });
  // wishlist panel
  const panel = document.getElementById('wishList');
  if (w.length === 0) {
    panel.innerHTML = '<div class="wish-empty">아직 체크한 곡이 없어요. 마음에 드는 곡의 체크박스를 눌러보세요!</div>';
  } else {
    panel.innerHTML = w.map(x => `
      <div class="wish-item">
        <span style="flex:1;">${x.title}</span>
        <button class="wish-remove" onclick="event.stopPropagation();toggleWish('${x.id}','')">삭제</button>
      </div>
    `).join('');
  }
}
function toggleWishlist() {
  document.getElementById('wishPanel').classList.toggle('show');
}

// === RENDER ===
function render() {
  const app = document.getElementById('app');
  app.innerHTML = PICKS.map(cat => `
    <div class="cat-section">
      <div class="cat-title"><span class="emoji">${cat.emoji}</span> ${cat.category}</div>
      <div class="cat-desc">${cat.desc}</div>
      ${cat.items.map(p => `
        <div class="pick-card">
          <div class="pick-header">
            <div class="pick-check" data-id="${p.id}" onclick="event.stopPropagation();toggleWish('${p.id}',\`${p.title}\`)"></div>
            <div class="pick-info" onclick="this.parentElement.nextElementSibling.classList.toggle('open')">
              <div class="pick-title">${p.title}</div>
              <div class="pick-composer">${p.composer}</div>
              <div class="pick-tags">
                ${p.tags.map(t => `<span class="tag tag-${t.c}">${t.t}</span>`).join('')}
              </div>
            </div>
          </div>
          <div class="pick-body">
            <div class="pick-desc">${p.desc}</div>
            <div class="pick-why"><strong>추천 이유:</strong> ${p.why}</div>
            <button class="play-btn-sm" onclick="event.stopPropagation();window.open('https://www.youtube.com/results?search_query='+encodeURIComponent('${p.yt} full performance'),'_blank')">
              ▶ YouTube에서 듣기
            </button>
          </div>
        </div>
      `).join('')}
    </div>
  `).join('');
  updateWishUI();
}
document.addEventListener('DOMContentLoaded', render);
