*{margin:0;padding:0;box-sizing:border-box;}

body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);line-height:1.8;min-height:100vh;}
.container{max-width:900px;margin:0 auto;padding:0 20px;}

/* NAV */
.top-bar{
  position:sticky;top:0;z-index:100;
  background:rgba(245,240,230,0.95);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(74,122,86,0.15);padding:12px 0;
  text-align:center;
}
.top-bar a{
  color:var(--green);text-decoration:none;font-size:0.85rem;font-weight:500;
  padding:6px 16px;border-radius:20px;border:1px solid var(--green);

}
.top-bar a:hover{background:var(--green);color:#fff;}

/* HERO */
.hero{text-align:center;padding:80px 20px 50px;}
.hero h1{font-size:2.2rem;font-weight:700;color:var(--green);margin-bottom:12px;}
.hero p{color:var(--text2);font-size:1rem;max-width:550px;margin:0 auto;}

/* CATEGORY */
.cat-section{margin-bottom:50px;}
.cat-title{
  font-size:1.2rem;font-weight:700;color:var(--text);
  margin-bottom:20px;padding-bottom:10px;
  border-bottom:2px solid var(--green);
  display:flex;align-items:center;gap:10px;
}
.cat-title .emoji{font-size:1.4rem;}
.cat-desc{font-size:0.88rem;color:var(--text2);margin:-12px 0 20px;padding-left:2px;}

/* CARD */
.pick-card{
  background:var(--card);border-radius:14px;padding:22px;margin-bottom:14px;
  border:1px solid rgba(0,0,0,0.06);transition:all 0.2s;cursor:pointer;
}
.pick-card:hover{border-color:var(--green);transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,0.06);}
.pick-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
.pick-title{font-size:1rem;font-weight:600;color:var(--text);}
.pick-composer{font-size:0.85rem;color:var(--green);margin-top:2px;}
.pick-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.tag{font-size:0.72rem;padding:3px 10px;border-radius:12px;font-weight:500;}
.tag-diff{background:#e8f0ea;color:var(--green);}
.tag-mood{background:#fdf0e0;color:var(--warm);}
.tag-type{background:#e8f0f8;color:var(--blue);}
.pick-body{display:none;margin-top:16px;padding-top:14px;border-top:1px solid rgba(0,0,0,0.06);}
.pick-body.open{display:block;}
.pick-desc{font-size:0.88rem;color:var(--text2);margin-bottom:12px;}
.pick-why{
  font-size:0.88rem;color:var(--text2);padding:12px 16px;
  background:var(--green-light);border-left:3px solid var(--green);
  border-radius:0 10px 10px 0;margin-bottom:12px;

.pick-why strong{color:var(--green);}
.play-btn-sm{

  background:var(--green);color:#fff;border-radius:20px;font-size:0.82rem;

.play-btn-sm:hover{background:var(--green-dim);}

footer{text-align:center;padding:40px 20px;color:var(--text3);font-size:0.8rem;border-top:1px solid rgba(0,0,0,0.06);}
footer a{color:var(--green);text-decoration:none;}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = PICKS.map(cat => `
    <div class="cat-section">
      <div class="cat-title"><span class="emoji">${cat.emoji}</span> ${cat.category}</div>
      <div class="cat-desc">${cat.desc}</div>
      ${cat.items.map((p, i) => `
        <div class="pick-card" onclick="this.querySelector('.pick-body').classList.toggle('open')">
          <div class="pick-top">
            <div>
              <div class="pick-title">${p.title}</div>
              <div class="pick-composer">${p.composer}</div>
            </div>
            <div class="pick-tags">
              ${p.tags.map(t => `<span class="tag tag-${t.c}">${t.t}</span>`).join('')}
            </div>
          </div>
          <div class="pick-body">
            <div class="pick-desc">${p.desc}</div>
            <div class="pick-why"><strong>이 곡을 추천하는 이유:</strong> ${p.why}</div>
            <button class="play-btn-sm" onclick="event.stopPropagation();window.open('https://www.youtube.com/results?search_query='+encodeURIComponent('${p.yt} full performance'),'_blank')">
              ▶ YouTube에서 듣기
            </button>
          </div>
        </div>
      `).join('')}
    </div>
  `).join('');
}
document.addEventListener('DOMContentLoaded', render);
</script>
